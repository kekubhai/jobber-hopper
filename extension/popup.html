<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Browser Agent</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #111827;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

        margin: 0 0 12px;

        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 8px;

        color: #ffffff;
        cursor: pointer;
        font-weight: 600;
      }

  <body>
    <h1>AI Browser Agent</h1>
    <p>Use the floating button on a webpage to analyze job forms or email requests.</p>
    <button id="open-dashboard" type="button">Open Dashboard</button>

</html>
